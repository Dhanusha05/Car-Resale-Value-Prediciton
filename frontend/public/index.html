<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Resale Price Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #13161d;
    --border: #1e2330;
    --accent: #e8ff5a;
    --accent2: #5af0e8;
    --accent3: #f05aaa;
    --text: #e8eaf0;
    --muted: #6b7280;
    --card: #191d28;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .best-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(232,255,90,0.08);
    border: 1px solid rgba(232,255,90,0.25);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
  }
  .best-badge .dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.4; transform:scale(0.8); }
  }
  .workspace {
    display: grid;
    grid-template-columns: 220px 1fr 340px;
    flex: 1;
    overflow: hidden;
  }
  /* LEFT */
  .left-panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 8px;
    overflow-y: auto;
  }
  .panel-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; letter-spacing: 2.5px;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0 6px;
    margin-bottom: 4px;
  }
  .algo-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .algo-card:hover { border-color: rgba(232,255,90,0.3); background: #1c2030; }
  .algo-card.active {
    border-color: var(--accent);
    background: rgba(232,255,90,0.06);
  }
  .algo-card.active::before {
    content: ''; position: absolute; left:0; top:0; bottom:0;
    width: 3px; background: var(--accent);
    border-radius: 3px 0 0 3px;
  }
  .algo-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; }
  .algo-card.active .algo-name { color: var(--accent); }
  .algo-tag { font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); }
  .algo-r2 { margin-top:8px; display:flex; align-items:center; gap:6px; }
  .r2-bar-bg { flex:1; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
  .r2-bar-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.6s ease; }
  .r2-val { font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); white-space:nowrap; }
  .algo-card.active .r2-val { color:var(--accent); }
  .best-star { position:absolute; top:8px; right:10px; font-size:11px; }
  /* CENTER */
  .center-panel { overflow-y:auto; padding:22px 28px; background:var(--bg); }
  .center-title {
    font-family: 'Space Mono', monospace;
    font-size: 9px; letter-spacing:2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label {
    font-size: 10px; font-weight:500;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .field input, .field select {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: #1c2030; }
  .predict-btn {
    width: 100%; padding:13px;
    background: var(--accent);
    color: #0d0f14;
    font-family: 'Space Mono', monospace;
    font-size: 12px; font-weight:700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: none; border-radius:10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .predict-btn:hover {
    background: #d4e84f;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(232,255,90,0.25);
  }
  .predict-btn:active { transform:translateY(0); }
  .predict-btn.loading { opacity:0.6; cursor:not-allowed; }
  .result-banner {
    display:none; background:var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-top: 16px;
    animation: slideUp 0.3s ease;
  }
  .result-banner.show { display:block; }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .result-banner.tier-low  { border-color:rgba(74,222,128,0.4);  background:rgba(74,222,128,0.05); }
  .result-banner.tier-mid  { border-color:rgba(250,204,21,0.4);  background:rgba(250,204,21,0.05); }
  .result-banner.tier-high { border-color:rgba(248,113,113,0.4); background:rgba(248,113,113,0.05); }
  .result-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .result-label {
    font-family:'Space Mono',monospace; font-size:9px;
    letter-spacing:2px; color:var(--muted);
    text-transform:uppercase; margin-bottom:4px;
  }
  .result-price { font-family:'Space Mono',monospace; font-size:24px; font-weight:700; color:var(--accent); }
  .result-sub { font-size:11px; color:var(--muted); margin-top:4px; }
  .tier-pill {
    padding:5px 13px; border-radius:20px;
    font-family:'Space Mono',monospace;
    font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  }
  .tier-low  .tier-pill { background:rgba(74,222,128,0.15);  color:var(--green);  border:1px solid var(--green); }
  .tier-mid  .tier-pill { background:rgba(250,204,21,0.15);  color:var(--yellow); border:1px solid var(--yellow); }
  .tier-high .tier-pill { background:rgba(248,113,113,0.15); color:var(--red);    border:1px solid var(--red); }
  /* RIGHT */
  .right-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .metrics-section-title {
    font-family:'Space Mono',monospace;
    font-size:9px; letter-spacing:2.5px;
    color:var(--muted); text-transform:uppercase;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
    margin-bottom:6px;
  }
  .metric-row {
    display:flex; align-items:center;
    justify-content:space-between;
    padding:8px 11px;
    background:var(--card);
    border-radius:8px;
    border:1px solid var(--border);
    gap:8px;
    margin-bottom:5px;
  }
  .metric-name { font-size:12px; font-weight:500; color:var(--muted); flex-shrink:0; min-width:60px; }
  .metric-bar-wrap { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .metric-bar { height:100%; border-radius:2px; transition:width 0.7s cubic-bezier(0.25,0.46,0.45,0.94); }
  .metric-bar.reg { background:var(--accent); }
  .metric-bar.cls { background:var(--accent2); }
  .metric-bar.bad { background:var(--accent3); }
  .metric-val {
    font-family:'Space Mono',monospace;
    font-size:11px; font-weight:700; color:var(--text);
    min-width:54px; text-align:right;
  }
  .no-model-msg {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    height:200px; gap:10px;
    color:var(--muted); text-align:center;
  }
  .no-model-msg .icon { font-size:32px; }
  .no-model-msg p { font-size:12px; line-height:1.6; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<header>
  <div class="logo">CarPredict <span>/ ML Dashboard</span></div>
  <div class="best-badge" id="bestBadge">
    <div class="dot"></div>
    <span id="bestModelName">Loading...</span>
    <span style="color:var(--muted)">&nbsp;— Best Model</span>
  </div>
</header>

<div class="workspace">

  <!-- LEFT: Algorithm Selection -->
  <div class="left-panel">
    <div class="panel-label">Algorithm</div>
    <div id="algoList"></div>
  </div>

  <!-- CENTER: Car Details Form -->
  <div class="center-panel">
    <div class="center-title">Enter Car Details</div>
    <div class="form-grid">
      <div class="field">
        <label>Year of Purchase</label>
        <input type="number" id="year" value="2018" min="2005" max="2023">
      </div>
      <div class="field">
        <label>KM Driven</label>
        <input type="number" id="km_driven" value="50000" min="1000" max="300000">
      </div>
      <div class="field">
        <label>Fuel Type</label>
        <select id="fuel">
          <option value="0">Petrol</option>
          <option value="1">Diesel</option>
          <option value="2">CNG</option>
          <option value="3">LPG</option>
          <option value="4">Electric</option>
        </select>
      </div>
      <div class="field">
        <label>Seller Type</label>
        <select id="seller_type">
          <option value="0">Individual</option>
          <option value="1">Dealer</option>
          <option value="2">Trustmark Dealer</option>
        </select>
      </div>
      <div class="field">
        <label>Transmission</label>
        <select id="transmission">
          <option value="0">Manual</option>
          <option value="1">Automatic</option>
        </select>
      </div>
      <div class="field">
        <label>Owner</label>
        <select id="owner">
          <option value="1">First Owner</option>
          <option value="2">Second Owner</option>
          <option value="3">Third Owner</option>
          <option value="4">Fourth &amp; Above</option>
        </select>
      </div>
      <div class="field">
        <label>Mileage (kmpl)</label>
        <input type="number" id="mileage" value="17.0" step="0.1" min="5" max="50">
      </div>
      <div class="field">
        <label>Engine (cc)</label>
        <input type="number" id="engine" value="1500" min="500" max="4000">
      </div>
      <div class="field">
        <label>Max Power (bhp)</label>
        <input type="number" id="max_power" value="100" step="0.5" min="30" max="300">
      </div>
      <div class="field">
        <label>Torque (Nm)</label>
        <input type="number" id="torque" value="200" step="1" min="50" max="500">
      </div>
      <div class="field">
        <label>Seats</label>
        <select id="seats">
          <option value="4">4</option>
          <option value="5" selected>5</option>
          <option value="6">6</option>
          <option value="7">7</option>
        </select>
      </div>
      <div class="field">
        <label>Showroom Price (₹)</label>
        <input type="number" id="actual_price" value="774691" min="50000" max="3000000">
      </div>
    </div>

    <button class="predict-btn" id="predictBtn" onclick="predict()">
      ▶ &nbsp;Predict Selling Price
    </button>

    <div class="result-banner" id="resultBanner">
      <div class="result-top">
        <div>
          <div class="result-label">Predicted Selling Price</div>
          <div class="result-price" id="resultPrice">—</div>
          <div class="result-sub" id="resultLakhs">—</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="tier-pill" id="tierPill">—</div>
          <div style="font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);text-align:right;margin-top:4px;" id="resultModel">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Metrics Panel -->
  <div class="right-panel">
    <div>
      <div class="metrics-section-title">Regression Metrics</div>
      <div id="regMetrics">
        <div class="no-model-msg">
          <div class="icon">📈</div>
          <p>Select an algorithm<br>to view its metrics</p>
        </div>
      </div>
    </div>
    <div>
      <div class="metrics-section-title">Classification Metrics</div>
      <div id="clsMetrics"></div>
    </div>
  </div>

</div>

<script>
const ALGORITHMS = ['Linear Regression', 'SVM', 'Random Forest', 'Gradient Boosting'];
const ALGO_TAGS  = {
  'Linear Regression': 'OLS · Scaled Features',
  'SVM':               'RBF Kernel · Scaled',
  'Random Forest':     'n=50 · Ensemble',
  'Gradient Boosting': 'lr=0.1 · Boosting',
};

let selectedAlgo = 'Random Forest';
let allMetrics   = {};
let bestModel    = '';

async function loadMetrics() {
  const res  = await fetch('/api/metrics');
  const data = await res.json();
  allMetrics = data.metrics;
  bestModel  = data.best_model;
  document.getElementById('bestModelName').textContent = bestModel;
  renderAlgoList();
  renderMetrics(selectedAlgo);
}

function renderAlgoList() {
  const container = document.getElementById('algoList');
  container.innerHTML = '';
  ALGORITHMS.forEach(name => {
    const m      = allMetrics[name] || {};
    const r2w    = m.R2 ? (m.R2 * 100).toFixed(1) : 0;
    const isBest = name === bestModel;
    const card   = document.createElement('div');
    card.className = 'algo-card' + (name === selectedAlgo ? ' active' : '');
    card.innerHTML = `
      ${isBest ? '<div class="best-star">⭐</div>' : ''}
      <div class="algo-name">${name}</div>
      <div class="algo-tag">${ALGO_TAGS[name]}</div>
      <div class="algo-r2">
        <div class="r2-bar-bg"><div class="r2-bar-fill" style="width:${r2w}%"></div></div>
        <div class="r2-val">R²&nbsp;${(m.R2||0).toFixed(3)}</div>
      </div>`;
    card.onclick = () => { selectedAlgo = name; renderAlgoList(); renderMetrics(name); };
    container.appendChild(card);
  });
}

function renderMetrics(name) {
  const m = allMetrics[name];
  if (!m) return;

  const REG = [
    { key:'MAE',  label:'MAE',    type:'reg', fmt: v=>v.toFixed(4),       pct: v=>Math.max(0,100-Math.min(v/2*100,100)) },
    { key:'MSE',  label:'MSE',    type:'bad', fmt: v=>v.toFixed(4),       pct: v=>Math.max(0,100-Math.min(v/5*100,100)) },
    { key:'RMSE', label:'RMSE',   type:'reg', fmt: v=>v.toFixed(4),       pct: v=>Math.max(0,100-Math.min(v/2*100,100)) },
    { key:'R2',   label:'R²',     type:'reg', fmt: v=>v.toFixed(4),       pct: v=>v*100 },
    { key:'MAPE', label:'MAPE %', type:'bad', fmt: v=>v.toFixed(2)+'%',   pct: v=>Math.max(0,100-Math.min(v/20*100,100)) },
  ];
  const CLS = [
    { key:'Accuracy',  label:'Accuracy',  type:'cls', fmt: v=>(v*100).toFixed(2)+'%', pct: v=>v*100 },
    { key:'Precision', label:'Precision', type:'cls', fmt: v=>(v*100).toFixed(2)+'%', pct: v=>v*100 },
    { key:'Recall',    label:'Recall',    type:'cls', fmt: v=>(v*100).toFixed(2)+'%', pct: v=>v*100 },
    { key:'F1',        label:'F1-Score',  type:'cls', fmt: v=>(v*100).toFixed(2)+'%', pct: v=>v*100 },
    { key:'ROC_AUC',   label:'ROC-AUC',   type:'cls', fmt: v=>v.toFixed(4),            pct: v=>v*100 },
  ];
  const rows = defs => defs.map(d => {
    const v = m[d.key] ?? 0;
    return `<div class="metric-row">
      <div class="metric-name">${d.label}</div>
      <div class="metric-bar-wrap"><div class="metric-bar ${d.type}" style="width:${d.pct(v).toFixed(1)}%"></div></div>
      <div class="metric-val">${d.fmt(v)}</div>
    </div>`;
  }).join('');

  document.getElementById('regMetrics').innerHTML = rows(REG);
  document.getElementById('clsMetrics').innerHTML = rows(CLS);
}

async function predict() {
  const btn = document.getElementById('predictBtn');
  btn.classList.add('loading');
  btn.textContent = '⏳  Predicting...';

  const payload = {
    model:        selectedAlgo,
    year:         document.getElementById('year').value,
    km_driven:    document.getElementById('km_driven').value,
    fuel:         document.getElementById('fuel').value,
    seller_type:  document.getElementById('seller_type').value,
    transmission: document.getElementById('transmission').value,
    owner:        document.getElementById('owner').value,
    mileage:      document.getElementById('mileage').value,
    engine:       document.getElementById('engine').value,
    max_power:    document.getElementById('max_power').value,
    torque:       document.getElementById('torque').value,
    seats:        document.getElementById('seats').value,
    actual_price: document.getElementById('actual_price').value,
  };

  try {
    const res  = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      const tier   = data.tier.toLowerCase();
      const emoji  = { low:'🟢 Low', mid:'🟡 Mid', high:'🔴 High' }[tier];
      const banner = document.getElementById('resultBanner');
      banner.className = `result-banner show tier-${tier}`;
      document.getElementById('resultPrice').textContent =
        '₹ ' + Number(data.predicted_rs).toLocaleString('en-IN', {maximumFractionDigits:0});
      document.getElementById('resultLakhs').textContent =
        data.predicted_lakhs.toFixed(4) + ' Lakhs';
      document.getElementById('tierPill').textContent  = emoji;
      document.getElementById('resultModel').textContent = data.model;
    } else {
      alert('Error: ' + data.error);
    }
  } catch(e) { alert('Network error: ' + e.message); }

  btn.classList.remove('loading');
  btn.textContent = '▶  Predict Selling Price';
}

loadMetrics();
</script>
</body>
</html>
